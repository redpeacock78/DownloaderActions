name: DownloaderAction
on:
  repository_dispatch:
    types:
      - downloaderaction

jobs:
  run:
    runs-on: ubuntu-22.04 # ubuntu-latest
    name: Run
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
      - name: Create directory
        shell: bash
        run: mkdir -p download
      # - name: Setup ffmpeg
      #   uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Setup Library
        shell: bash
        run: |
          is_nkf=$(type nkf > /dev/null 2>&1 && : || echo -n nkf)
          is_rar=$(type rar > /dev/null 2>&1 && : || echo -n rar)
          is_unar=$(type unar > /dev/null 2>&1 && : || echo -n unar)
          is_ffmpeg=$(type ffmpeg > /dev/null 2>&1 && : || echo -n ffmpeg)
          if [[ ${is_nkf} == "" ]] && [[ ${is_rar} == "" ]] && [[ ${is_unar} == "" ]] && [[ ${is_ffmpeg} == "" ]]; then
            :
          else
            sudo apt-get update && \
            sudo apt-get install -y ${is_nkf} ${is_rar} ${is_unar} ${is_ffmpeg}
          fi
          npm i -g npm@latest --registry=https://registry.npmjs.org && \
          type sharp > /dev/null 2>&1 || npm i -g --allow-scripts=sharp sharp-cli@4.2.0
      - name: Masking Secrets
        shell: bash
        run: |
          echo -n '::add-mask::' >> secrets.txt && \
          jq -r '.client_payload.link' < "${GITHUB_EVENT_PATH}" >> secrets.txt && \
          echo -n '::add-mask::' >> secrets.txt && \
          jq -r '.client_payload.channel' < "${GITHUB_EVENT_PATH}" >> secrets.txt && \
          echo -n '::add-mask::' >> secrets.txt && \
          jq -r '.client_payload.message' < "${GITHUB_EVENT_PATH}" >> secrets.txt && \
          cat secrets.txt && \
          rm -rf secrets.txt
      - name: Setup WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: wireguard
      - name: Start Tor Proxy
        shell: bash
        run: |
          docker network create proxy-net && \
          docker run -it -d \
            -p 8118:8118 \
            -p 9050:9050 \
            --name tor-proxy \
            --network proxy-net \
            dockurr/tor:latest && \
          sleep 20
          docker run -it -d \
            -p 8080:8080 \
            --name gost-proxy \
            --network proxy-net \
            gogost/gost:latest \
            -L :8080 -F socks5://tor-proxy:9050 && \
          sleep 1
      - name: Confirmation of link survival
        id: link_status
        shell: bash
        run: |
          if [[ ${{ toJSON(github.event.client_payload.link) }} =~ ^http.*$ ]]; then
            retry=0
            flag=false
            status=""
            until "${flag}" || (( "${retry}" == 1000 )); do
              echo "Retry count: ${retry}"
              echo "Flag status: ${flag}"
              status="$(curl -siL --head -m 18000 --retry 100 --retry-all-errors -x http://localhost:8080 ${{ toJSON(github.event.client_payload.link) }} -o /dev/null -w '%{http_code}\n';:)"
              if [[ "${status}" == "200" || "${status}" == "302" || "${status}" == "307" ]]; then
                flag=true
              else
                ((retry++)) || :
                sleep 1
              fi
            done
            if [[ "${status}" != "200" && "${status}" != "302" && "${status}" != "307" ]]; then
              status="notfound" && \
              echo "status=${status}" >> "${GITHUB_OUTPUT}" && \
              exit 2
            fi
          fi
      - name: Make dht.dat
        if: ${{ success() }}
        id: make_dht
        shell: bash
        run: |
          hex=""
          hex+="a1 a2"
          hex+="02"
          hex+="00 00 00"
          hex+="00 03"
          hex+=$(printf "%016x\n" $(date --utc +%s))
          hex+="00 00 00 00 00 00 00 00"
          hex+=$(dd if=/dev/random bs=1 count=40 status=none | sha1sum - | cut -c1-40)
          hex+="00 00 00 00"
          hex+="00 00 00 00"
          hex+="00 00 00 00"
          echo ${hex} | xxd -r -p > dht.dat && \
          echo "dht_path=$(pwd)" >> "$GITHUB_OUTPUT"
      - name: Datermine the port numer to use
        if: ${{ success() }}
        id: use_port
        shell: bash
        run: |
          echo "number=$(echo {1024..65535} | tr ' ' \\n | sed '/^8118$/d;/^9050$/d' | shuf -n1)" >> "$GITHUB_OUTPUT"
      - name: Start Docker
        if: ${{ success() }}
        timeout-minutes: 300
        shell: bash
        run: |
          cd download && \
          port=${{ steps.use_port.outputs.number }} && \
          dht_path=${{ steps.make_dht.outputs.dht_path }} && \
          docker run --rm -i \
            --network proxy-net \
            -p ${port}:${port} \
            -p ${port}:${port}/udp \
            -v $(pwd):/download \
            -v ${dht_path}:/root/.cache/aria2 \
            redpeacock78/downloaderaction:latest \
            -s20 -j20 -x16 -k20M \
            --all-proxy="http://gost-proxy:8080" \
            --listen-port=${port} \
            --dht-listen-port=${port} \
            --disable-ipv6=true \
            --continue=true \
            --seed-time=0 \
            --max-tries=0 \
            --retry-wait=10 \
            --summary-interval=0 \
            --download-result=hide \
            --console-log-level=error \
            ${{ toJSON(github.event.client_payload.link) }}
      - name: Adjust file name
        if: ${{ success() }}
        shell: bash
        run: |
          cd download && \
          file="$(ls)" && \
          new_name="$(echo "${file}" | nkf -w --url-input)" && \
          if [[ "${file}" != "${new_name}" ]]; then
            mv "${file}" "${new_name}"
          fi
      - name: Adjust Audio/Video file size
        if: ${{ success() }}
        timeout-minutes: 300
        shell: bash
        run: |
          cd download && \
          file="$(ls)" && \
          type="$(file --mime-type "${file}" | awk -F ": " '{sub(/^ /,"",$2);print $2}')" && \
          if [[ "${type}" == "text/plain" ]] && [[ "${file##*.}" == "m3u8" ]]; then
            ffmpeg -i "${file}" -c copy "${file%.*}.mp4" && \
            rm -rf "${file}" && \
            file="$(ls)"
          fi
          if [[ "${type}" =~ "video/" ]] || [[ "${type}" =~ "audio/" ]]; then
            if (( "$(wc -c < "${file}")" <= 104857600 )); then
              :
            else
              ffmpeg -i "${file}" -fs 100MB -loglevel error "${file%.*}_cps.${file##*.}"
              if (( "$(wc -c < "${file}")" <= "$(wc -c < "${file%.*}_cps.${file##*.}")" )); then
                rm -rf "${file%.*}_cps.${file##*.}"
              else
                rm -rf "${file}" && \
                mv "${file%.*}_cps.${file##*.}" "${file%.*}.${file##*.}"
              fi
            fi
          fi
      - name: Resize Archive
        if: ${{ success() }}
        timeout-minutes: 300
        shell: bash
        run: |
          cd download && \
          file="$(ls)" && \
          if (( "$(wc -c < "${file}")" <= 9437184 )); then
            :
          else
            type=$(file --mime-type "${file}" | awk -F ": " '{sub(/^ /,"",$2);print $2}')
            if [[ "${type}" =~ "/zip" ]] || [[ "${type}" =~ "/x-7z-compressed" ]] || [[ "${type}" =~ "/x-rar" ]]; then
              unar -q "${file}" && \
              mv "${file%.*}/" "./${file%.*}_origin/" && \
              mkdir "${file%.*}" && \
              flag="0" && \
              dir_name="$(pwd)/${file%.*}" && \
              cd "${file%.*}_origin" && \
              IFS=$'\n' && \
              for file_name in $(ls); do
                if [[ "$(file --mime-type "${file_name}" | awk -F : '{sub(/^ /,"",$2);print $2}')" =~ "image/" ]]; then
                  :
                else
                  flag="1"
                fi
              done
              if [[ "${flag}" == "0" ]]; then
                job=0
                max_jobs=1
                cpu_cores="$(nproc)"
                cpu_per_job=100
                rss_per_job_kb=1048576
                reserve_kb=4194304
                target_cpu_percent=75
                # ponytail: keep 4 GiB and 25% CPU headroom; use per-image cgroups if variance still causes OOM
                calibrated=false
                calibration_ok=false

                running_jobs() {
                  jobs -rp | wc -l
                }

                calibrate_job() {
                  local pid="$1"
                  local sample cpu rss
                  local peak_cpu=0
                  local peak_rss=0
                  calibration_ok=false
                  for _ in 1 2 3 4 5; do
                    sample="$(ps -p "${pid}" -o pcpu=,rss= 2>/dev/null || true)"
                    if [[ -n "${sample}" ]]; then
                      read -r cpu rss <<< "${sample}"
                      if [[ "${rss}" =~ ^[0-9]+$ ]] && [[ "${cpu}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                        peak_cpu="$(awk -v current="${cpu}" -v peak="${peak_cpu}" 'BEGIN { print (current > peak ? current : peak) }')"
                        (( rss > peak_rss )) && peak_rss="${rss}"
                      fi
                    elif ! kill -0 "${pid}" 2>/dev/null; then
                      break
                    fi
                    sleep 1
                  done
                  if (( peak_rss > 0 )); then
                    calibration_ok=true
                    if [[ "$(awk -v cpu="${peak_cpu}" 'BEGIN { print (cpu > 0 ? 1 : 0) }')" == "1" ]]; then
                      cpu_per_job="${peak_cpu}"
                    fi
                    rss_per_job_kb=$((peak_rss * 2))
                    echo "Calibration: ${cpu_per_job}% CPU, ${rss_per_job_kb} KB RSS budget per job"
                  else
                    echo "Calibration: first job finished before sampling; keeping one job"
                  fi
                }

                update_max_jobs() {
                  local running total_cpu background_cpu available_kb cpu_capacity memory_slots next_jobs
                  running="$(running_jobs)"
                  total_cpu="$(ps -eo pcpu= 2>/dev/null | awk '{sum += $1} END {printf "%d\n", sum + 0}')"
                  available_kb="$(awk '/^MemAvailable:/ {print $2; exit}' /proc/meminfo)"
                  background_cpu="$(awk -v used="${total_cpu}" -v running="${running}" -v each="${cpu_per_job}" 'BEGIN { background = used - running * each; if (background < 0) background = 0; print background }')"
                  cpu_capacity="$(awk -v budget="$((cpu_cores * target_cpu_percent))" -v background="${background_cpu}" -v each="${cpu_per_job}" 'BEGIN { slots = int((budget - background) / each); if (slots < 1) slots = 1; print slots }')"
                  if (( available_kb > reserve_kb )); then
                    memory_slots=$(( (available_kb - reserve_kb) / rss_per_job_kb ))
                  else
                    memory_slots=0
                  fi
                  next_jobs="${cpu_capacity}"
                  (( next_jobs > running + memory_slots )) && next_jobs=$((running + memory_slots))
                  (( next_jobs < running )) && next_jobs="${running}"
                  (( next_jobs > 5 )) && next_jobs=5
                  (( next_jobs < 1 )) && next_jobs=1
                  if (( next_jobs != max_jobs )); then
                    echo "Resources: ${total_cpu}% CPU, $((available_kb / 1024)) MiB available, ${running} running, max ${next_jobs}"
                  fi
                  max_jobs="${next_jobs}"
                }

                launch_file() {
                  local file_name="$1"
                  echo "Job count: ${job}"
                  ((job++)) || true
                  if [[ "$(file --mime-type "${file_name}" | awk -F ": " '{sub(/^ /,"",$2);print $2}')" =~ "image/" ]]; then
                    sharp -i "${file_name}" -f avif -q 17 --effort 6 -o "${dir_name}/" &
                  else
                    cp "${file_name}" "${dir_name}/${file_name}" &
                  fi
                  launched_pid="$!"
                }

                IFS=$'\n'
                for file_name in $(ls); do
                  if [[ "${calibrated}" == "false" ]]; then
                    launch_file "${file_name}"
                    calibrate_job "${launched_pid}"
                    if [[ "${calibration_ok}" == "true" ]]; then
                      calibrated=true
                      update_max_jobs
                    else
                      max_jobs=1
                    fi
                    continue
                  fi
                  while :; do
                    update_max_jobs
                    (( "$(running_jobs)" < max_jobs )) && break
                    sleep 1
                  done
                  launch_file "${file_name}"
                done
                wait
                cd .. && \
                rm -rf "${file}" && \
                rm -rf "${file%.*}_origin/" && \
                rar a -em5 -idq "${file%.*}.rar" "${file%.*}/*" && \
                rm -rf "${file%.*}/"
              else
                cd .. && \
                rm -rf "${file%.*}_origin/" && \
                rm -rf "${file%.*}/"
              fi
            fi
          fi
      - name: Upload files to anonfiles
        if: ${{ success() }}
        id: anonfiles
        shell: bash
        run: |
          cd download && \
          file="$(ls)"
          name="${file}"
          type="$(file --mime-type "${name}" | awk -F : '{sub(/^ /,"",$NF);print $NF}')"
          if (( "$(wc -c < "${name}")" <= 104857600 )); then
            PROXY_URL="${{ secrets.PROXY_URL }}"
          else
            PROXY_URL="${{ secrets.ANOTHER_PROXY_URL }}"
          fi
          json=""
          retry=0
          flag=false
          until "${flag}" || (( "${retry}" == 1000 )); do
            echo "Retry count: ${retry}"
            echo "Flag status: ${flag}"
            json="$(curl -s -m 3000000 --retry 1000 --retry-all-errors -X POST "${PROXY_URL}/v2/upload" -F "file=@${name}")"
            if jq -e . <<< "${json}" >/dev/null 2>&1; then
              result="$(jq -r '.url // empty' <<< "${json}")"
              if [[ -n "${result}" ]]; then
                flag=true
              else
                ((retry++)) || true
                sleep 1
              fi
            else
              ((retry++)) || true
              sleep 1
            fi
          done
          echo "::add-mask::${json}" && \
          echo "${json}" >> upload.json
      - name: All succeeded
        if: ${{ success() }}
        shell: bash
        run: |
          cd download && \
          file="$(ls | grep -v 'upload.json')"
          name="${file}"
          size="$(echo $(ls -hl | grep -v 'upload.json' | tail -n1 | awk '{print $5}')B)"  
          type="$(file --mime-type "${file}" | awk -F : '{sub(/^ /,"",$2);print $2}')"
          result="$(jq -r -R 'fromjson? | .url' < upload.json)"
          link="${{ secrets.PROXY_URL }}${result}"
          curl -s -X POST \
            ${{ secrets.ENDPOINT_URL }} \
            -H "Accept: application/json" \
            -H "Content-type: application/json" \
            -m 18000 \
            --retry 100 \
            --retry-all-errors \
            -d @- <<EOF
          {
            "status": "success",
            "channel": ${{ toJSON(github.event.client_payload.channel) }},
            "message": ${{ toJSON(github.event.client_payload.message) }},
            "title": "${name}",
            "size": "${size}",
            "type": "${type}",
            "link": "${link}",
            "origin_link": ${{ toJSON(github.event.client_payload.link) }}
          }
          EOF
      - name: Download file not found
        if: >-
          ${{
            failure() &&
            steps.link_status.outputs.status != '' &&
            steps.anonfiles.outputs.status == ''
          }}
        shell: bash
        run: |
          curl -s -X POST \
            ${{ secrets.ENDPOINT_URL }} \
            -H "Accept: application/json" \
            -H "Content-type: application/json" \
            -m 18000 \
            --retry 100 \
            --retry-all-errors \
            -d @- <<EOF
          {
            "status": "failure",
            "channel": ${{ toJSON(github.event.client_payload.channel) }},
            "message": ${{ toJSON(github.event.client_payload.message) }},
            "link": ${{ toJSON(github.event.client_payload.link) }},
            "content": "Sorry! This link has expired."
          }
          EOF
      - name: Download timed out
        if: >-
          ${{
            failure() &&
            steps.link_status.outputs.status == '' &&
            steps.anonfiles.outputs.status == ''
          }}
        shell: bash
        run: |
          curl -s -X POST \
            ${{ secrets.ENDPOINT_URL }} \
            -H "Accept: application/json" \
            -H "Content-type: application/json" \
            -m 18000 \
            --retry 100 \
            --retry-all-errors \
            -d @- <<EOF
          {
            "status": "failure",
            "channel": ${{ toJSON(github.event.client_payload.channel) }},
            "message": ${{ toJSON(github.event.client_payload.message) }},
            "link": ${{ toJSON(github.event.client_payload.link) }},
            "content": "Sorry! Processing time exceeded 5 hours and timed out."
          }
          EOF
      - name: File size exceeded
        if: >-
          ${{
            failure() &&
            steps.link_status.outputs.status == '' &&
            steps.anonfiles.outputs.status != ''
          }}
        shell: bash
        run: |
          curl -s -X POST \
            ${{ secrets.ENDPOINT_URL }} \
            -H "Accept: application/json" \
            -H "Content-type: application/json" \
            -m 18000 \
            --retry 100 \
            --retry-all-errors \
            -d @- <<EOF
          {
            "status": "failure",
            "channel": ${{ toJSON(github.event.client_payload.channel) }},
            "message": ${{ toJSON(github.event.client_payload.message) }},
            "link": ${{ toJSON(github.event.client_payload.link) }},
            "content": "File size exceeded. File size was ${{ steps.anonfiles.outputs.size }}."
          }
          EOF
